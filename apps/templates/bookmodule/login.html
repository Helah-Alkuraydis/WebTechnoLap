{% extends "layouts/base.html" %}

{% block title %} Login {% endblock %}

{% block content %}
<style>
    .msg-box { padding: 10px; margin-bottom: 15px; border-radius: 5px; }
    .msg-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .msg-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .msg-default { background-color: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }
</style>

<div style="margin: 20px; max-width: 500px;">
    <h2>Task 2: User Login</h2>
    <hr>
    
    {% if messages %}
        {% for message in messages %}
            <div class="msg-box {% if message.tags == 'success' %}msg-success{% elif message.tags == 'error' %}msg-error{% else %}msg-default{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        
        <button type="submit" style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%;">Login</button>
    </form>
    
    <p style="margin-top: 15px; text-align: center;">
        Don't have an account? <a href="/books/users/register">Register here</a>
    </p>
</div>
{% endblock %}
