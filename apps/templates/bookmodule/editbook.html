{% extends "layouts/base.html" %}

{% block title %} Edit Book {% endblock %}

{% block content %}
<div style="margin: 20px;">
    <h2>Task 3: Edit Book (ID: {{ book.id }})</h2>
    <hr>
    
    <form method="POST">
        {% csrf_token %}
        
        <div style="margin-bottom: 15px;">
            <label for="title">Book Title:</label><br>
            <input type="text" id="title" name="title" value="{{ book.title }}" required style="width: 300px; padding: 5px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label for="price">Price ($):</label><br>
            <input type="number" id="price" name="price" value="{{ book.price }}" step="0.01" required style="width: 300px; padding: 5px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label for="quantity">Quantity:</label><br>
            <input type="number" id="quantity" name="quantity" value="{{ book.quantity }}" required style="width: 300px; padding: 5px;">
        </div>

        <div style="margin-bottom: 15px;">
            <!-- لعرض التاريخ في حقل datetime-local، يجب صياغته بهذا الشكل -->
            <label for="pubdate">Publication Date & Time:</label><br>
            <input type="datetime-local" id="pubdate" name="pubdate" value="{{ book.pubdate|date:'Y-m-d\TH:i' }}" required style="width: 300px; padding: 5px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label for="rating">Rating (1-5):</label><br>
            <input type="number" id="rating" name="rating" value="{{ book.rating }}" min="1" max="5" required style="width: 300px; padding: 5px;">
        </div>

        <!-- قائمة الناشرين -->
        <div style="margin-bottom: 15px;">
            <label for="publisher">Publisher:</label><br>
            <select id="publisher" name="publisher" style="width: 315px; padding: 5px;">
                <option value="">-- Select a Publisher --</option>
                {% for pub in publishers %}
                    <!-- نتحقق إذا كان هذا الناشر هو نفس ناشر الكتاب لنقوم بتحديده مسبقاً -->
                    <option value="{{ pub.id }}" {% if pub.id == book.publisher_id %}selected{% endif %}>
                        {{ pub.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- قائمة المؤلفين -->
        <div style="margin-bottom: 20px;">
            <label for="authors">Authors (Hold Ctrl/Cmd to select multiple):</label><br>
            <select id="authors" name="authors" multiple style="width: 315px; padding: 5px; height: 100px;">
                {% for author in authors %}
                    <!-- نتحقق إذا كان هذا المؤلف موجود في قائمة مؤلفي هذا الكتاب -->
                    <option value="{{ author.id }}" {% if author in book.authors.all %}selected{% endif %}>
                        {{ author.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        
        <button type="submit" style="padding: 10px 20px; background-color: #f0ad4e; color: white; border: none; border-radius: 5px; cursor: pointer;">Update Book</button>
        <a href="/books/lab9_part1/listbooks" style="margin-left: 10px; color: gray;">Cancel</a>
    </form>
</div>
{% endblock %}
